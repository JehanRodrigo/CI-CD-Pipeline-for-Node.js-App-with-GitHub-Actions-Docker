name: "CICD NodeJS Application"

on:
    push:
        branches: [ "main" ]

        paths-ignore:
            - 'README.md'

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v3 # Checkout the code from the repository

            - name: DockerHub Login
              uses: docker/login-action@v4 # Use the Docker login action to authenticate with DockerHub
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build Dockerfile
              run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cicd-app .
            
            - name: Push to DockerHub
              run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/cicd-app


    deploy-ec2:
        runs-on: ubuntu-latest
        needs: build-and-push

        steps:
            - name: Deploy to EC2
              uses: appleboy/ssh-action@v1.0.3 # Use the SSH action to connect to the EC2 instance and deploy the application
              with:
                host: ${{ secrets.EC2_HOST }}
                username: ${{ secrets.EC2_USER }}
                key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
                script: |
                    cd /home/ubuntu/CI-CD-Pipeline-for-Node.js-App-with-GitHub-Actions-Docker                    

                    docker compose down
                    docker compose pull # Pull the latest image from DockerHub
                    docker compose up -d --build


